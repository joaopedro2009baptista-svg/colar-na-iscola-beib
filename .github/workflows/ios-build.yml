name: iOS build

on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    
jobs:

  build-ios:
  
    runs-on: macos-15
    
    timeout-minutes: 90
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        
      - name: Install CMake
      
        run: brew install cmake
        
      - name: Extract FIXED4 source
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          rm -rf "$RUNNER_TEMP/source"
          
          mkdir -p "$RUNNER_TEMP/source"
          
          unzip -q EstudaOffline_iOS_Updated_Source_v5_FIXED4.zip -d "$RUNNER_TEMP/source"
          
          PROJECT_PATH="$(find "$RUNNER_TEMP/source" -name EstudaOffline.xcodeproj -type d -print -quit)"
          
          test -n "$PROJECT_PATH"
          
          SRC_DIR="$(dirname "$PROJECT_PATH")"
          
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          
      - name: Build llama.cpp XCFramework
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          
          cd "$RUNNER_TEMP/llama.cpp"
          
          ./build-xcframework.sh ios-device
          
          mkdir -p "$SRC_DIR/Frameworks"
          
          cp -R build-apple/llama.xcframework "$SRC_DIR/Frameworks/llama.xcframework"
          
      - name: Show toolchain
      
        run: |
        
          xcodebuild -version
          
          xcodebuild -showsdks
          
      - name: Archive without Apple signing
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          cd "$SRC_DIR"
          
          xcodebuild archive -project EstudaOffline.xcodeproj -target EstudaOffline -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/EstudaOffline.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER=""
          
          APP_PATH="$(find "$RUNNER_TEMP/EstudaOffline.xcarchive" -type d -name 'EstudaOffline.app' -print -quit)"
          
          test -n "$APP_PATH"
          
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          
      - name: Package unsigned IPA
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          mkdir -p "$RUNNER_TEMP/Payload"
          
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/EstudaOffline-unsigned.ipa" Payload)
          
          shasum -a 256 "$GITHUB_WORKSPACE/EstudaOffline-unsigned.ipa"
          
      - name: Upload IPA and archive
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: EstudaOffline-iOS-unsigned-fixed4
          
          path: |
          
            EstudaOffline-unsigned.ipa
            
            ${{ runner.temp }}/EstudaOffline.xcarchive
            
          if-no-files-found: error
          
          retention-days: 14
          





























































